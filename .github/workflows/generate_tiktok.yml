name: 🚀 Usine de Production Vidéo TikTok (Prédications & Foi)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "🔗 Lien de la prédication source (YouTube, culte, enseignement...)"
        required: true
        type: string
      clips_count:
        description: "🔢 Nombre de clips TikTok à extraire"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      theme:
        description: "🎨 Thème Visuel & Ambiance"
        required: false
        default: "gospel"
        type: choice
        options:
          - "gospel"
          - "gold"
          - "neon"
          - "minimal"
      watermark:
        description: "🏷️ Identifiant de Marque (Watermark Safe-Zone)"
        required: false
        default: "@parole.de.foi"
        type: string
      publish_mode:
        description: "📱 Publication TikTok"
        required: false
        default: "public"
        type: choice
        options:
          - "public"
          - "draft"
          - "none"
      progress_bar:
        description: "⏱️ Ajouter la barre de progression animée"
        required: false
        default: true
        type: boolean

jobs:
  build-tiktok:
    name: 🎬 Découpage & Publication TikTok
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🌐 Configuration Réseau Anti-Blocage (Cloudflare WARP)
        uses: fscarmen/warp-on-actions@v1.4
        continue-on-error: true
        with:
          stack: dual
          mode: wireguard

      - name: 🍪 Configuration Cookies YouTube (Contournement Bot Datacenter)
        env:
          YOUTUBE_COOKIES_TEXT: ${{ secrets.YOUTUBE_COOKIES_TEXT }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_TEXT" ]; then
            echo "$YOUTUBE_COOKIES_TEXT" > /tmp/youtube_cookies.txt
            echo "YOUTUBE_COOKIES_FILE=/tmp/youtube_cookies.txt" >> $GITHUB_ENV
            echo "🍪 Cookies YouTube injectés pour contourner les restrictions d'IP cloud."
          fi

      - name: ⚙️ Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🎞️ Installation de FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-dejavu-core

      - name: 📦 Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp
          playwright install --with-deps chromium

      - name: 🚀 Lancement de la Machine TikTok (Prédications & Foi)
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          TIKTOK_WEBHOOK_URL: ${{ secrets.TIKTOK_WEBHOOK_URL }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          PROBE_VIDEO_URL: ${{ github.event.inputs.video_url }}
          CLIPS_COUNT: ${{ github.event.inputs.clips_count }}
          THEME: ${{ github.event.inputs.theme }}
          WATERMARK: ${{ github.event.inputs.watermark }}
          PUBLISH_MODE: ${{ github.event.inputs.publish_mode || 'public' }}
          PROGRESS_BAR: ${{ github.event.inputs.progress_bar }}
          USE_WARP: "true"
          ABORT_IF_YOUTUBE_BLOCKED: "0"
        run: |
          cmd=(python main.py --url "$VIDEO_URL" --clips "$CLIPS_COUNT" --theme "$THEME" --watermark "$WATERMARK" --publish "$PUBLISH_MODE" --output output)
          if [ "$PROGRESS_BAR" != "true" ]; then
            cmd+=(--no-progress-bar)
          fi
          if [ -n "$TIKTOK_WEBHOOK_URL" ]; then
            cmd+=(--webhook "$TIKTOK_WEBHOOK_URL")
          fi
          bash .github/scripts/run_with_youtube_proxy.sh "${cmd[@]}"

      - name: 📦 Archivage des Vidéos, Fiches & Captures TikTok Studio
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiktok-predication-${{ github.event.inputs.theme }}
          path: output/
          retention-days: 14

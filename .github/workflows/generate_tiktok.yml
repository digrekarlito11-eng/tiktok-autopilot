name: 🚀 Usine de Production Vidéo TikTok

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "🔗 Lien de la vidéo source (YouTube, interview, podcast...)"
        required: true
        type: string
      clips_count:
        description: "🔢 Nombre de clips TikTok à extraire"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      theme:
        description: "🎨 Thème Visuel & Palette Graphique"
        required: false
        default: "gold"
        type: choice
        options:
          - "gold"
          - "neon"
          - "minimal"
      watermark:
        description: "🏷️ Identifiant de Marque (Watermark Safe-Zone)"
        required: false
        default: "@karlstudio"
        type: string
      progress_bar:
        description: "⏱️ Ajouter la barre de progression animée"
        required: false
        default: true
        type: boolean

jobs:
  build-tiktok:
    name: 🎬 Génération Automatique TikTok
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🎞️ Installation de FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-dejavu-core

      - name: 📦 Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Lancement de la Machine TikTok (Media-Bot & Growth-Bot)
        run: |
          ARGS="--url '${{ github.event.inputs.video_url }}' --clips ${{ github.event.inputs.clips_count }} --theme ${{ github.event.inputs.theme }} --watermark '${{ github.event.inputs.watermark }}' --output output"
          if [ "${{ github.event.inputs.progress_bar }}" != "true" ]; then
            ARGS="$ARGS --no-progress-bar"
          fi
          python main.py $ARGS

      - name: 📦 Archivage des Vidéos TikTok & Fiches Prêtes à l'Emploi
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-pack-${{ github.event.inputs.theme }}
          path: output/
          retention-days: 14
